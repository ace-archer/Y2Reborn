[workspace]
resolver = "2"
members = ["crates/*", "app/reborn"]

[workspace.package]
version = "1.0.0-beta.9.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
libc = "=0.2.177"
cc = "=1.2.41"
pkg-config = "=0.3.32"
rusqlite = "=0.37.0"
dbus = "=0.9.9"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
tar = "=0.4.44"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Shared with Y2Reborn: release.py sync-contract copies this directory to Y2Reborn/crates/y2p-contract, and
# release.py build refuses to build when the copies differ. Self-contained on purpose (no workspace keys):
# it builds unchanged in both workspaces. MIT so the Reborn binary can link it.
[package]
name = "y2p-contract"
description = "Types and names of the records the Y2 platform prints and writes (platform_api_version 1)"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
